<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Предложение тарифа — день 14</title>
<meta name="description" content="Антикризисный радар: сколько курс, ставка и цены стоят вашему бизнесу — в рублях прибыли.">
<meta name="theme-color" content="#1F5EFF">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="radar.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="page-tariffs.css">
</head>
<body class="page-tariffs view-desktop">
<div id="dc-app"></div>
<noscript><p style="font-family:sans-serif;padding:24px">Для работы сайта включите JavaScript.</p></noscript>
<template id="dc-root">
<div style="min-height: 1000px; background: #F4F7FC; position: relative; overflow: hidden">
<div aria-hidden="true" style="position: absolute; inset: 0; display: flex; filter: blur(4px); opacity: .6"><div style="width: 248px; background: #fff"></div><div style="flex: 1; padding: 40px; display: grid; grid-template-columns: 380px 1fr; gap: 20px; align-content: start"><div style="height: 420px; border-radius: 24px; background: #1F5EFF"></div><div style="display: flex; flex-direction: column; gap: 14px"><div style="height: 110px; border-radius: 20px; background: #fff"></div><div style="height: 110px; border-radius: 20px; background: #fff"></div><div style="height: 110px; border-radius: 20px; background: #fff"></div></div></div></div>
<div style="position: absolute; inset: 0; background: rgba(10,21,48,.45)"></div>
<div role="dialog" aria-modal="true" aria-labelledby="ttl" class="a-pop" style="position: relative; margin: 56px auto; max-width: 1000px; background: #fff; border-radius: 32px; padding: 40px; display: flex; flex-direction: column; gap: 24px; box-shadow: 0 40px 80px rgba(10,21,48,.3)">
<div class="spread" style="align-items: flex-start">
<div style="display: flex; flex-direction: column; gap: 8px"><span class="chip chip-gain" style="align-self: flex-start">Пробный период заканчивается сегодня</span><h1 id="ttl" class="h2">Анна, за 2 недели радар нашёл для вас решений на ≈ 9 000 ₽ в месяц</h1></div>
<a class="icon-btn" href="app.html" aria-label="Закрыть" style="text-decoration: none">✕</a>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<div class="card" style="padding: 16px"><span class="cap">Сигналов</span><b class="num" style="display: block; font-size: 24px">7</b></div>
<div class="card" style="padding: 16px"><span class="cap">Применено</span><b class="num" style="display: block; font-size: 24px">3</b></div>
<div class="card" style="padding: 16px"><span class="cap">Тариф «Бизнес» окупается</span><b class="num" style="display: block; font-size: 24px">в 11 раз</b></div>
</div>
<div class="spread"><b style="font-size: 18px">Выберите тариф</b><div class="pills"><button class="{{mCls}}" onClick="{{setM}}">Месяц</button><button class="{{yCls}}" onClick="{{setY}}">Год −17%</button></div></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">
<template data-dc="for" list="{{plans}}" as="p">
<button class="{{p.cls}}" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}">
<div class="spread"><b style="font-size: 18px">{{p.name}}</b><span class="radio"></span></div>
<div><span class="num" style="font-size: 32px; font-weight: 700">{{p.price}}</span> <span class="muted small">{{p.per}}</span></div>
<span class="small muted">{{p.desc}}</span>
</button>
</template>
</div>
<div class="spread" style="border-top: 1px solid #E3E9F4; padding-top: 20px">
<span class="small muted">Возврат денег в течение 14 дней · отмена в 2 клика · НДС не облагается</span>
<div class="row"><a class="btn btn-ghost" href="app.html">Остаться на Free</a><a class="btn btn-primary btn-lg" href="checkout.html">{{cta}}</a></div>
</div>
<p class="cap">На Free останутся индекс давления раз в неделю, 1 сигнал без расчёта в рублях и дайджест. Ваши данные сохранятся.</p>
</div>
</div>
</template>
<script src="dc-lite.js"></script>
<script src="page-tariffs.js"></script>
</body>
</html>
