<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Антикризисный радар — лендинг, телефон</title>
<meta name="description" content="Антикризисный радар: сколько курс, ставка и цены стоят вашему бизнесу — в рублях прибыли.">
<meta name="theme-color" content="#1F5EFF">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>(function(){var q=location.search;if(q.indexOf('view=mobile')<0&&window.innerWidth>=1024)location.replace('index.html'+q+location.hash);})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="radar.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="page-m-landing.css">
</head>
<body class="page-m-landing view-mobile">
<div id="dc-app"></div>
<noscript><p style="font-family:sans-serif;padding:24px">Для работы сайта включите JavaScript.</p></noscript>
<template id="dc-root">
<div style="width: 390px; height: 5600px; overflow: hidden; background: #fff; position: relative">
<header style="height: 60px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,.9); backdrop-filter: blur(14px); box-shadow: 0 1px 0 #E3E9F4">
<a href="#top" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #0B1A33"><svg width="30" height="30" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="11" fill="#1F5EFF"></rect><path d="M13 27V9h6.5a5.5 5.5 0 0 1 0 11H13" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"></path></svg><b style="font-size: 15px">Антикризисный радар</b></a>
<button class="icon-btn" aria-label="Открыть меню" style="width: 44px; height: 44px"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14" stroke="#0B1A33" stroke-width="2" stroke-linecap="round"></path></svg></button>
</header>

<section id="top" style="position: relative; overflow: hidden; padding: 32px 16px 0">
<div class="blobm" style="width: 300px; height: 300px; background: #8FB1FF; left: -100px; top: 0; animation: drift1 20s ease-in-out infinite alternate"></div>
<div class="blobm" style="width: 260px; height: 260px; background: #9EE7FF; right: -90px; top: 160px; animation: drift2 24s ease-in-out infinite alternate"></div>
<div style="position: relative; display: flex; flex-direction: column; gap: 16px">
<span class="chip chip-line a-rise" style="align-self: flex-start; gap: 8px"><span class="dot ping" style="background: #0E8A43"></span>Ставка 14% · ЦБ 18 декабря</span>
<h1 style="font-size: 38px; line-height: 42px; font-weight: 700; letter-spacing: -0.02em"><span class="mask"><span>Сколько курс</span></span><span class="mask"><span style="animation-delay: .09s">и ставка стоят</span></span><span class="mask"><span style="animation-delay: .18s">именно вам — <span style="color: #1F5EFF">в рублях</span></span></span></h1>
<p class="body muted a-rise" style="animation-delay: .35s">1–3 действия в неделю с эффектом в рублях прибыли вашего бизнеса. Без ИНН и анкет.</p>
<a class="btn btn-primary btn-lg a-rise" href="signup.html" style="animation-delay: .5s">Получить снимок бизнеса</a>
<a class="btn btn-secondary btn-lg a-rise" href="m-app.html" style="animation-delay: .55s">Смотреть демо кофейни</a>
</div>
<div style="position: relative; height: 470px; margin-top: 28px">
<div style="position: absolute; left: 50%; margin-left: -125px; top: 0; width: 250px; height: 500px; border-radius: 40px; background: #0B1A33; padding: 9px; box-shadow: 0 30px 60px rgba(11,26,51,.25); animation: rise .9s var(--out) .6s both">
<div style="height: 100%; border-radius: 32px; background: linear-gradient(180deg,#DCE6FF,#fff 65%); padding: 52px 12px 0">
<div class="num" style="text-align: center; font-size: 48px; font-weight: 600">10:14</div>
<div class="a-pop" style="margin-top: 18px; background: #fff; border-radius: 16px; padding: 12px; box-shadow: 0 8px 20px rgba(11,26,51,.12); font-size: 12px; line-height: 16px; animation-delay: 1.2s"><b>Радар · сейчас</b><br>Юань +2,8% за 30 дней<br><span style="color: #4A5A75">−6 900 ₽/мес · зафиксируйте закупку зерна</span></div>
<div class="a-pop" style="margin-top: 8px; background: rgba(255,255,255,.75); border-radius: 16px; padding: 12px; font-size: 12px; line-height: 16px; animation-delay: 1.5s"><b>Радар · 2 ч назад</b><br>ЦБ 18.12: до +2 100 ₽/мес по кредиту</div>
</div>
</div>
<div class="bobm" style="position: absolute; left: 0; top: 300px"><div class="card-sh a-pop" style="padding: 10px 14px; animation-delay: 1.8s"><div class="cap">Индекс давления</div><b style="font-size: 18px">64/100</b></div></div>
<div class="bobm" style="position: absolute; right: 0; top: 80px; animation-delay: -2s"><div class="card-sh a-pop" style="padding: 10px 14px; animation-delay: 2s"><div class="cap">Вилка 80%</div><b class="num" style="font-size: 14px">−5 500…−8 800 ₽</b></div></div>
</div>
</section>

<section class="m-sec" style="background: #F4F7FC; padding-top: 48px">
<span class="eyebrow">Почему сейчас</span>
<h2 class="m-h" style="margin-top: 10px">Внешняя среда меняет прибыль каждую неделю</h2>
<div style="display: flex; flex-direction: column; gap: 12px; margin-top: 24px">
<div class="card rv"><div class="num" style="font-size: 48px; font-weight: 700; color: #1F5EFF">14%</div><p class="small">ключевая ставка · Банк России, 23.10.2026</p></div>
<div class="card rv"><div class="num" style="font-size: 48px; font-weight: 700; color: #1F5EFF">+15,4%</div><p class="small">юань с 18 мая · курс ЦБ 12,38 ₽ на 11.11.2026</p></div>
<div class="card rv"><div class="num" style="font-size: 48px; font-weight: 700; color: #1F5EFF">6,98%</div><p class="small">инфляция за год · Минэкономразвития, 09.11.2026</p></div>
</div>
</section>

<section class="m-sec">
<span class="eyebrow">Как это работает</span>
<h2 class="m-h" style="margin-top: 10px">Три шага</h2>
<div class="snap" style="margin-top: 20px">
<div class="card" style="min-height: 220px; display: flex; flex-direction: column; gap: 10px"><span class="num" style="width: 36px; height: 36px; border-radius: 50%; background: #1F5EFF; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700">1</span><b style="font-size: 19px">Расскажите одной фразой</b><span class="small muted">«Две кофейни, зерно из Китая, кредит 2,5 млн плавающий»</span><div class="row"><span class="chip">Кофейня</span><span class="chip">Юань</span><span class="chip">Кредит</span></div></div>
<div class="card" style="min-height: 220px; display: flex; flex-direction: column; gap: 10px"><span class="num" style="width: 36px; height: 36px; border-radius: 50%; background: #1F5EFF; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700">2</span><b style="font-size: 19px">Радар считает</b><span class="small muted">Юань +2,8% → 42% закупок → 39% выручки</span><b class="loss num" style="font-size: 26px">−6 900 ₽/мес</b></div>
<div class="card" style="min-height: 220px; display: flex; flex-direction: column; gap: 10px"><span class="num" style="width: 36px; height: 36px; border-radius: 50%; background: #1F5EFF; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700">3</span><b style="font-size: 19px">Получаете действие</b><span class="small muted">В Telegram, с кнопками «Почему?» и «Применить»</span></div>
</div>
<div class="row" style="justify-content: center; margin-top: 12px"><span class="dot"></span><span class="dot" style="background: #C9D4E8"></span><span class="dot" style="background: #C9D4E8"></span></div>
</section>

<section class="m-sec" style="background: #F4F7FC">
<h2 class="m-h">Юань +5% за месяц. У каждого — своя сумма</h2>
<div class="pills" role="tablist" style="margin-top: 20px; display: flex; overflow-x: auto">
<template data-dc="for" list="{{tabs}}" as="t"><button class="{{t.cls}}" role="tab" onClick="{{t.pick}}" style="white-space: nowrap">{{t.name}}</button></template>
</div>
<div style="margin-top: 16px; border-radius: 24px; padding: 24px; color: #fff; background: {{b.bg}}; display: flex; flex-direction: column; gap: 10px; transition: background .5s">
<span class="chip" style="align-self: flex-start; background: rgba(255,255,255,.18); color: #fff">{{b.tag}}</span>
<div class="num" style="font-size: 44px; line-height: 48px; font-weight: 700">{{b.v}} ₽</div>
<span style="font-size: 14px; opacity: .85">в месяц · {{b.note}}</span>
<b style="font-size: 17px; line-height: 24px">{{b.act}}</b>
</div>
</section>

<section class="m-sec">
<span class="eyebrow">«Почему?»</span>
<h2 class="m-h" style="margin-top: 10px">Числа считает код. ИИ объясняет. Решаете вы</h2>
<div class="card-sh" style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px">
<div style="align-self: flex-end; background: #1F5EFF; color: #fff; padding: 10px 14px; border-radius: 16px 16px 4px 16px; font-size: 14px">Почему прибыль может упасть?</div>
<div style="background: #F4F7FC; padding: 12px 14px; border-radius: 16px 16px 16px 4px; font-size: 14px; line-height: 21px">Юань вырос на 2,8%. Зерно — 42% себестоимости. Прибыль снизится на ≈ 6 900 ₽ в месяц. Зафиксируйте закупку на 2 месяца.</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div class="card a-pop" style="padding: 10px 12px"><span class="cap">Событие</span> <b class="small">Юань +2,8%</b></div>
<div class="card a-pop" style="padding: 10px 12px; animation-delay: .15s"><span class="cap">Канал</span> <b class="small">42% закупок в юанях</b></div>
<div class="card-blue a-pop" style="padding: 10px 12px; animation-delay: .3s"><span class="cap">Эффект</span> <b class="small num">−6 900 ₽/мес</b></div>
</div>
</div>
</section>

<section class="m-sec" style="background: #0A1530; color: #fff">
<span class="eyebrow" style="color: #9FC0FF">Насколько мы точны</span>
<h2 class="m-h" style="margin-top: 10px; color: #fff">Мы не обещаем точность — мы её измеряем</h2>
<div style="display: flex; flex-direction: column; gap: 14px; margin-top: 20px">
<div style="border-top: 1px solid rgba(255,255,255,.14); padding-top: 14px"><b>Только официальные источники</b><p class="small" style="color: rgba(255,255,255,.7); margin-top: 4px">Ссылка у каждого числа</p></div>
<div style="border-top: 1px solid rgba(255,255,255,.14); padding-top: 14px"><b>ИИ не придумывает цифр</b><p class="small" style="color: rgba(255,255,255,.7); margin-top: 4px">Считает формула, код проверяет текст</p></div>
<div style="border-top: 1px solid rgba(255,255,255,.14); padding-top: 14px"><b>Метрики — после пилота на 30 бизнесах</b><div class="skeleton" style="height: 24px; width: 60%; opacity: .25; margin-top: 8px"></div></div>
</div>
</section>

<section class="m-sec" style="background: #F4F7FC">
<h2 class="m-h" style="text-align: center">Первые 14 дней — «Бизнес» бесплатно</h2>
<div class="snap" style="margin-top: 20px">
<div class="price-card" style="background: #fff; border-radius: 24px; padding: 24px; box-shadow: inset 0 0 0 1px #E3E9F4; display: flex; flex-direction: column; gap: 12px"><b>Радар Free</b><span class="num" style="font-size: 36px; font-weight: 700">0 ₽</span><span class="small muted">Индекс раз в неделю, 1 сигнал без расчёта в ₽, дайджест</span></div>
<div style="background: #1F5EFF; color: #fff; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 40px rgba(31,94,255,.3)"><b>Бизнес</b><span class="num" style="font-size: 36px; font-weight: 700">790 ₽ <span style="font-size: 15px; opacity: .8">/ мес</span></span><span class="small" style="opacity: .85">Сигналы в ₽, «Что если», пороги, календарь, чат 30 вопросов, господдержка</span><a class="btn btn-white" href="signup.html">Попробовать 14 дней</a></div>
<div style="background: #fff; border-radius: 24px; padding: 24px; box-shadow: inset 0 0 0 1px #E3E9F4; display: flex; flex-direction: column; gap: 12px"><b>Бизнес+</b><span class="num" style="font-size: 36px; font-weight: 700">1 990 ₽ <span class="muted" style="font-size: 15px">/ мес</span></span><span class="small muted">Выписка, 1С, МойСклад, до 5 точек, чат без лимита</span></div>
</div>
</section>

<section class="m-sec">
<div style="border-radius: 28px; padding: 28px 20px; color: #fff; background: linear-gradient(135deg,#1747D6,#1F5EFF 50%,#5B8CFF); background-size: 300% 300%; animation: wave 18s ease-in-out infinite alternate; display: flex; flex-direction: column; gap: 14px">
<h2 class="m-h" style="color: #fff">Узнайте свой запас за 2 минуты</h2>
<label class="field"><span class="label">Одной фразой о бизнесе</span><textarea class="textarea" placeholder="две кофейни, зерно из Китая, кредит 2,5 млн плавающий" style="min-height: 100px"></textarea></label>
<label class="field"><span class="label">Телефон</span><input class="input" type="tel" placeholder="+7 (___) ___-__-__"></label>
<button class="btn btn-white btn-lg" type="button">Получить снимок</button>
</div>
</section>
<footer style="background: #0A1530; color: rgba(255,255,255,.6); padding: 32px 16px; font-size: 13px; line-height: 19px">Антикризисный радар · Стартап-студия НГУ<br>Не является индивидуальной инвестиционной рекомендацией.</footer>
<div style="position: absolute; left: 16px; right: 16px; bottom: 16px; z-index: 6"><a class="btn btn-primary btn-lg" href="signup.html" style="width: 100%; box-shadow: 0 12px 30px rgba(31,94,255,.4)">Получить снимок бизнеса</a></div>
</div>
</template>
<script src="dc-lite.js"></script>
<script src="page-m-landing.js"></script>
</body>
</html>
