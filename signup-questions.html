<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Онбординг, шаг 3 — Уточнения</title>
<meta name="description" content="Антикризисный радар: сколько курс, ставка и цены стоят вашему бизнесу — в рублях прибыли.">
<meta name="theme-color" content="#1F5EFF">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="radar.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="page-signup-questions.css">
</head>
<body class="page-signup-questions view-desktop">
<div id="dc-app"></div>
<noscript><p style="font-family:sans-serif;padding:24px">Для работы сайта включите JavaScript.</p></noscript>
<template id="dc-root">
<div style="min-height: 900px; background: #F4F7FC; display: flex; flex-direction: column">
<header style="height: 72px; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; gap: 24px; background: #fff; box-shadow: 0 1px 0 #E3E9F4">
<a href="signup-profile.html" class="btn btn-ghost btn-sm">← Назад</a>
<div style="display: flex; gap: 6px; width: 320px" aria-label="Шаг 3 из 4"><span class="seg on"></span><span class="seg on"></span><span class="seg on"></span><span class="seg"></span></div>
<span class="cap num">Вопрос {{qn}} из 3</span>
</header>
<div style="flex: 1; display: flex; justify-content: center; padding: 64px 24px">
<div style="width: 100%; max-width: 1000px; display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 40px; align-items: start">
<template data-dc="for" list="{{qs}}" as="q">
<div class="a-rise" style="display: flex; flex-direction: column; gap: 20px">
<span class="chip" style="align-self: flex-start">Этот ответ сузит вилку сильнее всего</span>
<h1 class="h1">{{q.t}}</h1>
<p class="lead">{{q.why}}</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<template data-dc="for" list="{{q.opts}}" as="o"><button class="opt" onClick="{{o.pick}}">{{o.t}}</button></template>
</div>
<button class="btn btn-ghost" onClick="{{skip}}" style="align-self: flex-start">Пропустить — поставим типичное значение</button>
</div>
</template>
<template data-dc="if" value="{{finished}}">
<div class="a-rise" style="display: flex; flex-direction: column; gap: 20px">
<span class="chip chip-gain" style="align-self: flex-start">Профиль собран</span>
<h1 class="h1">Готово. Осталось сохранить снимок</h1>
<p class="lead">Радар уже посчитал индекс давления и три главных риска для вашей кофейни.</p>
<a class="btn btn-primary btn-lg" href="signup-save.html" style="align-self: flex-start">Показать снимок</a>
</div>
</template>
<div class="card-sh" style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
<svg width="140" height="140" viewBox="0 0 120 120" role="img" aria-label="Точность профиля"><circle cx="60" cy="60" r="50" fill="none" stroke="#DCE6FF" stroke-width="10"></circle><circle class="ring" cx="60" cy="60" r="50" fill="none" stroke="#1F5EFF" stroke-width="10" stroke-linecap="round" stroke-dasharray="314" stroke-dashoffset="{{off}}" transform="rotate(-90 60 60)"></circle><text x="60" y="68" text-anchor="middle" font-size="26" font-weight="700" font-family="Onest, system-ui, sans-serif" fill="#0B1A33">{{acc}}%</text></svg>
<b>Точность профиля</b>
<span class="small muted">Вилка эффекта: <b class="num">{{fork}}</b></span>
</div>
</div>
</div>
</div>
</template>
<script src="dc-lite.js"></script>
<script src="page-signup-questions.js"></script>
</body>
</html>
