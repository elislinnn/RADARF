<head>

<meta name="description" content="Антикризисный радар: сколько курс, ставка и цены стоят вашему бизнесу — в рублях прибыли.">
<meta name="theme-color" content="#1F5EFF">

<body class="page-signup-save view-desktop">
<div id="dc-app"></div>
<noscript><p style="font-family:sans-serif;padding:24px">Для работы сайта включите JavaScript.</p></noscript>
<template id="dc-root">
<div style="min-height: 900px; background: #F4F7FC; display: flex; flex-direction: column; position: relative; overflow: hidden">
<header style="height: 72px; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; gap: 24px; background: #fff; box-shadow: 0 1px 0 #E3E9F4; position: relative; z-index: 2">
<a href="signup-questions.html" class="btn btn-ghost btn-sm">← Назад</a>
<div style="display: flex; gap: 6px; width: 320px" aria-label="Шаг 4 из 4"><span class="seg"></span><span class="seg"></span><span class="seg"></span><span class="seg"></span></div>
<span class="cap">Последний шаг</span>
</header>
<div aria-hidden="true" style="position: absolute; inset: 72px 0 0; padding: 40px 120px; filter: blur(10px); opacity: .7; display: grid; grid-template-columns: 340px 1fr; gap: 24px; align-content: start">
<div style="height: 280px; border-radius: 20px; background: #1F5EFF"></div>
<div style="display: flex; flex-direction: column; gap: 14px"><div style="height: 84px; border-radius: 20px; background: #fff"></div><div style="height: 84px; border-radius: 20px; background: #fff"></div><div style="height: 84px; border-radius: 20px; background: #fff"></div></div>
<div style="grid-column: 1 / 3; height: 120px; border-radius: 20px; background: #fff"></div>
</div>
<div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px; position: relative">
<form class="card-sh a-pop" style="width: 100%; max-width: 480px; padding: 36px; border-radius: 28px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 30px 60px rgba(11,26,51,.18)">
<span class="chip chip-gain" style="align-self: flex-start">Снимок готов</span>
<h1 class="h2">Куда присылать сигналы?</h1>
<p class="body muted">Сохраним снимок вашей кофейни и пришлём первый сигнал, как только юань или ставка заденут ваш бизнес.</p>
<label class="field"><span class="label">Как к вам обращаться</span><input class="input" value="Анна" autocomplete="given-name"></label>
<label class="field"><span class="label">Телефон</span><input class="input" type="tel" value="+7 (913) 555-24-18" autocomplete="tel"></label>
<label class="check"><input type="checkbox" checked><span>Согласен на обработку персональных данных и принимаю оферту</span></label>
<label class="check"><input type="checkbox"><span>Хочу получать дайджест по понедельникам (можно отключить)</span></label>
<a class="btn btn-primary btn-lg" href="signup-snapshot.html">Показать снимок</a>
<span class="cap" style="text-align: center">Пришлём код в SMS. Первые 14 дней — тариф «Бизнес» бесплатно, карта не нужна</span>
</form>
</div>
</div>
</template>
<script src="dc-lite.js"></script>
<script src="page-signup-save.js"></script>
