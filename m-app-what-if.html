<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Что если — телефон</title>
<meta name="description" content="Антикризисный радар: сколько курс, ставка и цены стоят вашему бизнесу — в рублях прибыли.">
<meta name="theme-color" content="#1F5EFF">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>(function(){var q=location.search;if(q.indexOf('view=mobile')<0&&window.innerWidth>=1024)location.replace('app-what-if.html'+q+location.hash);})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="radar.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="page-m-app-what-if.css">
</head>
<body class="page-m-app-what-if view-mobile">
<div id="dc-app"></div>
<noscript><p style="font-family:sans-serif;padding:24px">Для работы сайта включите JavaScript.</p></noscript>
<template id="dc-root">
<div style="width: 390px; height: 844px; background: #F4F7FC; position: relative; overflow: hidden">
<div style="position: absolute; left: 0; right: 0; top: 0; z-index: 2; background: #fff; padding: 54px 16px 16px; box-shadow: 0 8px 20px rgba(11,26,51,.06); display: flex; flex-direction: column; gap: 10px">
<b style="font-size: 22px">Что если</b>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
<div style="border-radius: 16px; background: #1F5EFF; color: #fff; padding: 12px"><span class="cap" style="color: rgba(255,255,255,.8)">Прибыль в месяц</span><div class="num" style="font-size: 24px; font-weight: 700">{{profit}} ₽</div><span class="small" style="opacity: .85">{{delta}} ₽</span></div>
<div style="border-radius: 16px; background: #F4F7FC; padding: 12px"><span class="cap">Безубыточная цена</span><div class="num" style="font-size: 24px; font-weight: 700">{{be}} ₽</div><span class="small muted">капучино 230 ₽</span></div>
</div>
</div>
<div style="padding: 236px 16px 120px; display: flex; flex-direction: column; gap: 16px">
<div class="pills" style="display: flex"><template data-dc="for" list="{{scen}}" as="c"><button class="{{c.cls}}" onClick="{{c.pick}}" style="flex: 1">{{c.t}}</button></template></div>
<div class="card" style="display: flex; flex-direction: column; gap: 18px">
<label class="field"><span class="spread"><span class="label">Юань</span><b class="num">{{yl}}</b></span><input class="rng" type="range" min="-10" max="20" value="{{yuan}}" onChange="{{onY}}"></label>
<label class="field"><span class="spread"><span class="label">Ключевая ставка</span><b class="num">{{rl}}</b></span><input class="rng" type="range" min="8" max="20" step="0.5" value="{{rate}}" onChange="{{onR}}"></label>
<label class="field"><span class="spread"><span class="label">Аренда</span><b class="num">{{al}}</b></span><input class="rng" type="range" min="0" max="20" value="{{rent}}" onChange="{{onA}}"></label>
</div>
<span class="cap">Результат закреплён сверху — цифра всегда на виду, пока двигаете ползунки</span>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 3"><template data-dc="import" name="TabBar" active="whatif"></template></div>
</div>
</template>
<script src="dc-lite.js"></script>
<script src="comp-tabbar.js"></script>
<script src="page-m-app-what-if.js"></script>
</body>
</html>
